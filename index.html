<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="用四色结构快速读懂英文长难句" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%232c2926'/%3E%3Cpath d='M17 17h30v8H25v7h18v8H25v7h22v8H17z' fill='%23fffaf4'/%3E%3C/svg%3E" />
    <title>句读 · 英语长难句分析</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="#" aria-label="句读首页">
        <span class="brand__mark">E</span>
        <span>句读</span>
      </a>
      <div class="header-meta">
        <span class="demo-badge">交互 Demo</span>
        <span class="header-tagline">看清句子，再读懂英语</span>
      </div>
    </header>

    <main class="page-shell">
      <section class="hero" aria-labelledby="page-title">
        <p class="eyebrow">ENGLISH SENTENCE LENS</p>
        <h1 id="page-title">粘贴一个看不懂的英文长句</h1>
        <p class="hero__lead">把复杂句子拆成四种功能成分，快速看清结构，并获得自然中文翻译。</p>
      </section>

      <section class="workspace" aria-label="句子分析器">
        <form class="input-card" id="analyze-form" novalidate>
          <label class="sr-only" for="sentence-input">英文句子</label>
          <textarea id="sentence-input" maxlength="500" spellcheck="false" placeholder="在这里粘贴一个完整的英文句子……">The book that I bought yesterday is interesting.</textarea>
          <div class="input-card__footer">
            <div class="input-hint">
              <span id="character-count">49 / 500</span>
              <span class="shortcut">Ctrl ↵ 提交</span>
            </div>
            <button class="primary-button" id="analyze-button" type="submit">
              <span class="button-label">分析句子</span>
              <span aria-hidden="true">→</span>
            </button>
          </div>
        </form>

        <div class="error-message" id="error-message" role="alert" hidden></div>

        <div class="examples" aria-label="示例句">
          <span class="examples__label">试试示例</span>
          <div class="example-list" id="example-list"></div>
        </div>

        <section class="result-card" id="result-card" aria-live="polite" hidden>
          <div class="result-card__header">
            <div>
              <p class="section-kicker">句子结构</p>
              <p class="section-note">按各成分在整句中的整体作用标注</p>
            </div>
            <ul class="legend" aria-label="颜色说明">
              <li><i class="dot dot--noun"></i>名词性</li>
              <li><i class="dot dot--adjective"></i>形容词性</li>
              <li><i class="dot dot--adverb"></i>副词性</li>
              <li><i class="dot dot--verb"></i>动词</li>
            </ul>
          </div>

          <div class="sentence-result" id="sentence-result"></div>

          <div class="translation-block">
            <p class="section-kicker">自然中文翻译</p>
            <p class="translation" id="translation"></p>
          </div>

          <div class="fallback-note" id="fallback-note" hidden>
            当前是前端 Demo，仅预设示例句支持完整标注。正式版将连接真实分析服务。
          </div>
        </section>

        <section class="result-skeleton" id="result-skeleton" aria-label="正在分析" hidden>
          <div class="skeleton skeleton--short"></div>
          <div class="skeleton skeleton--sentence"></div>
          <div class="skeleton skeleton--divider"></div>
          <div class="skeleton skeleton--translation"></div>
        </section>
      </section>
    </main>

    <footer>
      <span>Demo 数据均在浏览器本地模拟，不会上传或保存。</span>
      <span>四色只表示句子功能，不表示单词词性。</span>
    </footer>

    <script type="module" src="./app.mjs"></script>
  </body>
</html>
